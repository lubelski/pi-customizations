name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: terminal-logs-${{ matrix.os }}
          path: test-artifacts/
          if-no-files-found: ignore
